
spring.application.name=smartmetrix-backend


# ==============================
# DATABASE
# ==============================

# Render uses DATABASE_URL.
# Local development uses PostgreSQL on localhost.


# ==============================
# DATABASE
# ==============================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartmetrix}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Rajnish@9219}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==============================
# JPA / HIBERNATE
# ==============================

# Preserve existing database schema and data.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

# Avoid unnecessary SQL output during normal development.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ==============================
# HIKARI CONNECTION POOL
# ==============================

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ==============================
# JWT
# ==============================

# Production must provide a strong JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-32-characters}

app.jwt.expiration=3600000


# ==============================
# CORS
# ==============================

# Local frontend: http://localhost:5173
# Production: configure CORS_ALLOWED_ORIGINS on Render.

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# ==============================
# CERTIFICATE QR VERIFICATION
# ==============================

# Local frontend verification page.
# Production: configure VERIFICATION_BASE_URL on Render.

app.verification.base-url=${VERIFICATION_BASE_URL:http://localhost:5173/verify}


# ==============================
# LOGGING
# ==============================

logging.level.org.springframework.security=INFO
logging.level.com.smartmetrix.backend=INFO
logging.level.org.hibernate.SQL=WARN


